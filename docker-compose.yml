# Local PostgreSQL with pgvector preinstalled.
# Usage: docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: tracevault-db
    environment:
      POSTGRES_USER: tracevault
      POSTGRES_PASSWORD: tracevault
      POSTGRES_DB: tracevault
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - tracevault_pgdata:/var/lib/postgresql/data

volumes:
  tracevault_pgdata:
